[workspace]
channels = ["conda-forge"]
name = "test"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test-server = "python -m unittest discover -s tests -p 'test_*.py'"
server = "python dictation_websocket_server.py"

[dependencies]
python = ">=3.9.0,<3.10"
uv = ">=0.11.31,<0.12"

[pypi-dependencies]
gitman = ">=3.1"
websockets = ">=15, <16"
